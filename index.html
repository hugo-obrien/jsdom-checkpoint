<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vain Labor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-home">
<div id="header-placeholder"></div>

<main class="main">
    <section class="parallax-container" id="parallaxContainer">
        <img src="content/img/parallax-common-2.png" alt="background" class="parallax-background" id="parallaxBg">
        <div class="content">
            <div class="inner-content">
                <h1>Создаем игры с душой</h1>
                <p>Инди-студия, которая верит в силу истории и геймплея.</p>
                <button id="cta-button">Начать приключение</button>
            </div>
        </div>
    </section>

    <section class="features">
        <div class="feature-card" data-anim="fadeIn">
            <h3>Уникальные миры</h3>
            <p>Каждая игра - отдельное приключение с неповторимой атмосферой</p>
        </div>
        <div class="feature-card" data-anim="fadeIn">
            <h3>Глубокий сюжет</h3>
            <p>Истории, которые запоминаются надолго</p>
        </div>
        <div class="feature-card" data-anim="fadeIn">
            <h3>Любовь к деталям</h3>
            <p>Мы вкладываем душу в каждый пиксель</p>
        </div>
    </section>
</main>

<div id="footer-placeholder"></div>

<script src="js/main.js"></script>
<script src="js/animations.js"></script>
<script src="js/components-loader.js"></script>
<script src="js/parallax.js"></script>
</body>
</html>
